name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: SCA - govulncheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      # 不用 golang/govulncheck-action：其內建 module cache 還原會在既有快取上
      # 重複解壓，產生大量 tar "Cannot open: File exists" 錯誤註解（job 仍成功）。
      # 直接 go run 掃描，行為與本地 task security:govulncheck 一致。
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  osv-scanner:
    name: SCA - osv-scanner
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --format=json
            --output=osv-scanner-results.json
            --lockfile=go.mod
        continue-on-error: true

      - name: Generate SARIF report
        uses: google/osv-scanner-action/osv-reporter-action@v2.5.1
        with:
          scan-args: |-
            --output=osv-scanner.sarif.json
            --new=osv-scanner-results.json
            --gh-annotations=false
            --fail-on-vuln=true

      - name: Upload osv-scanner results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: osv-scanner.sarif.json

  gosec:
    name: SAST - gosec
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run gosec
        uses: securego/gosec@v2.29.0
        with:
          args: -no-fail -fmt sarif -out gosec-results.sarif ./...

      - name: Upload gosec results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec-results.sarif

  codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
