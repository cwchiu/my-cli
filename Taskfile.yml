version: '3'

vars:
  BINARY_NAME: my-cli
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ

tasks:
  default:
    desc: 顯示可用 tasks
    cmds:
      - task --list

  build:
    desc: 編譯二進位（注入 version/commit/date）
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}" -o {{.BINARY_NAME}}{{exeExt}} ./cmd/my-cli
    sources:
      - cmd/**/*.go
      - go.mod
      - go.sum
    generates:
      - "{{.BINARY_NAME}}{{exeExt}}"

  run:
    desc: 編譯並執行 version 子命令
    cmds:
      - task: build
      - "{{.BINARY_NAME}}{{exeExt}} version"

  test:
    desc: 跑全部測試（本機無 -race；-race 僅在 CI）
    cmds:
      - go test -shuffle=on ./...

  vet:
    desc: go vet 靜態檢查
    cmds:
      - go vet ./...

  fmt:
    desc: 格式化（golangci-lint fmt：gofumpt + goimports）
    cmds:
      - go tool golangci-lint fmt

  lint:
    desc: golangci-lint run（經 go.mod tool directive，無需另裝 PATH）
    cmds:
      - go tool golangci-lint run

  tidy:
    desc: go mod tidy 並確認無殘留 diff
    cmds:
      - go mod tidy
      - git diff --exit-code go.mod go.sum

  security:govulncheck:
    desc: govulncheck 掃描（呼叫點分析，標準库+依賴）
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  security:osv:
    desc: osv-scanner 掃描 go.mod（與 CI 同版本 v2.5.1）
    cmds:
      - go run github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.1 scan --lockfile=go.mod

  security:all:
    desc: 全部安全掃描（govulncheck + osv-scanner）
    cmds:
      - task: security:govulncheck
      - task: security:osv

  release:check:
    desc: 驗證 .goreleaser.yaml（go run 臨時執行，不進 go.mod；與 CI 同版本 v2.18.1）
    cmds:
      - go run github.com/goreleaser/goreleaser/v2@v2.18.1 check

  release:build:
    desc: 本地試 build release 產物（跳過 publish；需先有 tag 或 --snapshot）
    cmds:
      - go run github.com/goreleaser/goreleaser/v2@v2.18.1 release --snapshot --skip=publish --clean

  clean:
    desc: 移除建置產物
    cmds:
      - cmd: rm -f {{.BINARY_NAME}}{{exeExt}}
        platforms: [linux, darwin]
      - cmd: cmd /c "if exist {{.BINARY_NAME}}.exe del {{.BINARY_NAME}}.exe"
        platforms: [windows]
